name: Release & Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build Multi-Language EdgeTX Suite Radio Installation ZIPs
  build-suite-zips:
    name: Build Radio Install ZIPs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Radio ZIPs
        run: |
          python .github/scripts/build_zips.py

      - name: Upload Suite ZIPs to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          generate_release_notes: true

  # 2. Build Updater Standalone Executables (Windows, Linux, macOS)
  build-updater:
    name: Build Updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: rfsuite-edgetx-updater-windows.exe
            built_file: bin/updater/src/dist/rfsuite-updater.exe
          - os: ubuntu-latest
            artifact_name: rfsuite-edgetx-updater-linux
            built_file: bin/updater/src/dist/rfsuite-updater
          - os: macos-latest
            artifact_name: rfsuite-edgetx-updater-macos
            built_file: bin/updater/src/dist/rfsuite-updater

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Build Standalone Executable
        shell: bash
        run: |
          cd bin/updater/src
          pyinstaller --onefile --noconsole --name rfsuite-updater updater.py

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p build_out
          cp "${{ matrix.built_file }}" "build_out/${{ matrix.artifact_name }}"

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build_out/*
